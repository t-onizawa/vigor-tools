  <body>
    <main class="page-shell">
      <header class="list-header">
        <p class="brand-row"><a href="../index.html">VIGOR LAB</a></p>
        <h1>MATSURI</h1>
        <p class="header-description">
          祭りの気配を、探しにいく。
        </p>
      </header>

      <section id="upcoming-soon-section" class="upcoming-soon-section" aria-label="開催中・まもなく開催の祭り" hidden>
        <div id="upcoming-soon-list" class="upcoming-soon-list"></div>
      </section>

      <section class="filter-section" aria-label="絞り込み">
        <label class="filter-toggle">
          <input id="upcoming-only-toggle" type="checkbox">
          <span>これから開催される祭り</span>
        </label>
        <label class="area-filter-label" for="area-filter">
          <span class="sr-only">都道府県で絞り込み</span>
        </label>
        <select id="area-filter" class="area-filter">
          <option value="">すべての都道府県</option>
          <option value="region:kanto">関東（全県）</option>
          <option value="region:tohoku">東北（全県）</option>
          <option value="region:chubu">中部（全県）</option>
          <option value="region:kinki">近畿（全県）</option>
          <optgroup label="関東">
            <option value="ibaraki">茨城県</option>
            <option value="chiba">千葉県</option>
            <option value="saitama">埼玉県</option>
            <option value="tokyo">東京都</option>
            <option value="kanagawa">神奈川県</option>
            <option value="tochigi">栃木県</option>
            <option value="gunma">群馬県</option>
          </optgroup>
          <optgroup label="東北">
            <option value="aomori">青森県</option>
            <option value="iwate">岩手県</option>
            <option value="akita">秋田県</option>
            <option value="miyagi">宮城県</option>
            <option value="yamagata">山形県</option>
            <option value="fukushima">福島県</option>
          </optgroup>
          <optgroup label="中部">
            <option value="niigata">新潟県</option>
            <option value="toyama">富山県</option>
            <option value="ishikawa">石川県</option>
            <option value="fukui">福井県</option>
            <option value="yamanashi">山梨県</option>
            <option value="nagano">長野県</option>
            <option value="gifu">岐阜県</option>
            <option value="shizuoka">静岡県</option>
            <option value="aichi">愛知県</option>
          </optgroup>
          <optgroup label="近畿">
            <option value="mie">三重県</option>
            <option value="shiga">滋賀県</option>
            <option value="kyoto">京都府</option>
            <option value="osaka">大阪府</option>
            <option value="hyogo">兵庫県</option>
            <option value="nara">奈良県</option>
            <option value="wakayama">和歌山県</option>
          </optgroup>
        </select>
      </section>

      <section class="filter-section" aria-label="特徴・開催月で絞り込み">
        <label class="area-filter-label" for="feature-filter">
          <span class="sr-only">特徴で絞り込み</span>
        </label>
        <select id="feature-filter" class="area-filter">
          <option value="">すべての特徴</option>
          <option value="hasDashi">山車</option>
          <option value="hasMikoshi">神輿</option>
          <option value="hasDanceOnDashi">踊り</option>
          <option value="hasParade">曳き回し</option>
        </select>
        <label class="area-filter-label" for="month-filter">
          <span class="sr-only">開催月で絞り込み</span>
        </label>
        <select id="month-filter" class="area-filter">

          <option value="12">12月</option>

      <div id="festival-list" class="festival-list" aria-live="polite"></div>
