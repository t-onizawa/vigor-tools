<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>石岡のおまつり | VIGOR MATSURI</title>
    <link rel="stylesheet" href="../../shared/festival-detail.css">
  </head>
  <body>
    <main class="page-shell" aria-labelledby="festival-name">
      <header class="festival-header">
        <p class="project-label">VIGOR MATSURI</p>
        <h1 id="festival-name"></h1>
        <p class="prefecture" id="festival-prefecture"></p>
      </header>

      <section class="primary-info" aria-labelledby="dates-heading">
        <div>
          <p class="section-label" id="dates-heading"></p>
          <p class="section-label-note" id="event-status-note"></p>
          <p class="date-list" id="festival-dates"></p>
        </div>
        <span class="status-badge" id="event-status"></span>
      </section>

      <section class="info-section" aria-labelledby="city-heading">
        <h2 id="city-heading">開催地</h2>
        <p id="festival-city"></p>
      </section>

      <section class="info-section" aria-labelledby="features-heading">
        <h2 id="features-heading">特徴</h2>
        <div class="feature-grid" id="feature-grid"></div>
      </section>

      <section class="info-section" aria-labelledby="highlight-time-heading">
        <h2 id="highlight-time-heading">見どころの時間帯</h2>
        <p id="highlight-time"></p>
      </section>

      <section class="info-section" aria-labelledby="access-heading">
        <h2 id="access-heading">アクセス</h2>
        <div class="detail-list" id="access-list"></div>
      </section>

      <section class="info-section" aria-labelledby="hayashi-heading">
        <h2 id="hayashi-heading">お囃子の特徴</h2>
        <p id="hayashi-note"></p>
      </section>

      <section class="info-section" id="highlight-comment-section" aria-labelledby="highlight-comment-heading" hidden>
        <h2 id="highlight-comment-heading">一言見どころコメント</h2>
        <p id="highlight-comment-text"></p>
      </section>

      <section class="info-section media-section" id="atmosphere-media-section" aria-labelledby="atmosphere-media-heading" hidden>
        <h2 id="atmosphere-media-heading">動画で見る</h2>
        <p class="media-notice" id="atmosphere-media-notice"></p>
        <div class="media-frame" id="atmosphere-media-frame"></div>
        <p class="source-meta" id="atmosphere-media-meta"></p>
      </section>

      <section class="info-section sources-section" aria-labelledby="sources-heading">
        <h2 id="sources-heading">出典・確認日</h2>
        <div class="source-block" id="constant-sources"></div>
        <div class="source-block" id="yearly-sources"></div>
      </section>
    </main>

    <script src="./data.js"></script>
    <script src="../../shared/festival-detail.js"></script>
  </body>
</html>
